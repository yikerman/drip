[workspace]
resolver = "3"
members = ["crates/drip", "crates/drip-cli", "crates/drip-gui", "crates/drip-libraw"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
drip = { path = "crates/drip" }
drip-libraw = { path = "crates/drip-libraw" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Image processing at opt-level 0 is too slow to test or use on real raws.
[profile.dev]
opt-level = 1
