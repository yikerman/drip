name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Linux is the primary platform: full lint and test.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libraw-dev liblcms2-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --workspace --doc
      - run: python3 crates/drip-gui/tests/check_bindings.py

  # Windows and macOS are targets we keep building, but test only loosely.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Until LibRaw is built statically from source (TODO.md), take it from
      # each platform's package manager.
      - if: runner.os == 'macOS'
        run: brew install libraw pkg-config
      - if: runner.os == 'Windows'
        run: |
          vcpkg install libraw:x64-windows-static-md
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - run: cargo build --locked --workspace --all-targets
