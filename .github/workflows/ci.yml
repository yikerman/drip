name: CI & Dist artifacts

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-26.04' }}    # TODO: remove

    steps:

      # env setup
      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/native-deps

      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --workspace --doc

  dist:
    name: Dist (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
          - name: macos-amd64
            os: macos-26-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: linux-amd64
            os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/native-deps

      - run: cargo xtask dist --target ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: cargo test --locked --profile dist --target ${{ matrix.target }} --workspace

      - uses: actions/upload-artifact@v4
        with:
          name: drip-${{ matrix.name }}
          path: ./dist/
          if-no-files-found: error
