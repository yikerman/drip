[package]
name = "drip"
description = "Drip processing library: node graph, image processing, color management, persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
drip-libraw.workspace = true
lcms2 = "6.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
drip-libraw = { workspace = true, features = ["reference"] }
lcms2 = "6.2"
