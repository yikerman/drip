[package]
name = "drip"
description = "Drip processing library: node graph, image processing, color management, persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["wgpu"]
wgpu = ["cubecl/wgpu"]
vulkan = ["wgpu", "cubecl/vulkan"]
metal = ["wgpu", "cubecl/metal"]
metal-native = ["cubecl/metal-native"]
cpu = ["cubecl/cpu"]
cuda = ["cubecl/cuda"]
hip = ["cubecl/hip"]

[dependencies]
cubecl = { version = "=0.11.0", default-features = false, features = ["std"] }
cubecl-environment = { version = "=0.11.0", features = ["shared-bytes"] }
bytes = "1"
bytemuck = "1"
pollster = "1.0.1"
drip-macros = { path = "../drip-macros" }
linkme = "0.3.37"
drip-raw.workspace = true
lcms2.workspace = true
log = "0.4.34"
rayon = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
drip-raw = { workspace = true, features = ["reference"] }
